<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On Tap</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181c24;
    --panel-2: #1f2430;
    --text: #f3f1ea;
    --muted: #9aa3b2;
    --accent: #f2b53a;
    --line: #2b3240;
    --radius: 18px;
    /* TVs often crop the outer few percent of the picture (overscan). */
    --safe: 3vmin;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #1c2130 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: calc(var(--safe) + clamp(8px, 1vw, 16px));
    gap: clamp(10px, 1.6vh, 24px);
    overflow: hidden;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  h1 { margin: 0; font-size: clamp(26px, 4vw, 60px); letter-spacing: 0.02em; font-weight: 700; }
  .clock { color: var(--muted); font-size: clamp(16px, 2vw, 30px); font-variant-numeric: tabular-nums; }

  main {
    flex: 1; min-height: 0;
    display: grid;
    gap: clamp(10px, 1.4vw, 22px);
    grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
    /* minmax(0, …) so rows never grow past the screen; cards clip instead. */
    grid-auto-rows: minmax(0, 1fr);
  }
  .tap, .tile {
    --fs: var(--scale, 1);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: calc(clamp(12px, 1.4vw, 24px) * var(--fs));
    min-height: 0; overflow: hidden;
  }
  .tap {
    display: grid;
    grid-template-columns: auto auto 1fr;
    grid-template-rows: auto auto 1fr;
    column-gap: clamp(10px, 1.2vw, 20px);
    row-gap: clamp(4px, 0.6vh, 10px);
    align-items: start;
  }
  .num {
    grid-row: 1 / span 3;
    width: calc(clamp(40px, 4vw, 76px) * var(--fs)); height: calc(clamp(40px, 4vw, 76px) * var(--fs));
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent); color: #1a1405;
    font-weight: 800; font-size: calc(clamp(18px, 2.1vw, 38px) * var(--fs));
  }
  .glass {
    grid-row: 1 / span 3;
    height: calc(clamp(56px, 7.2vw, 128px) * var(--fs));
    width: auto;
  }
  .name {
    font-size: calc(clamp(20px, 2.5vw, 44px) * var(--fs));
    font-weight: 700; line-height: 1.1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .style { color: var(--muted); font-size: calc(clamp(14px, 1.45vw, 25px) * var(--fs)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bottom { align-self: end; display: flex; flex-direction: column; gap: clamp(4px, 0.6vh, 10px); min-width: 0; }
  .stats { display: flex; flex-wrap: wrap; gap: clamp(10px, 1.5vw, 26px); }
  .stat { display: flex; flex-direction: column; }
  .stat b { font-size: calc(clamp(18px, 2.05vw, 36px) * var(--fs)); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat span { font-size: calc(clamp(10px, 0.9vw, 15px) * var(--fs)); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .meta { color: var(--muted); font-size: calc(clamp(12px, 1.05vw, 17px) * var(--fs)); display: flex; gap: 1.2em; flex-wrap: wrap; }
  .empty {
    grid-column: 1 / -1; display: grid; place-items: center; text-align: center;
    color: var(--muted); font-size: clamp(18px, 2vw, 32px);
  }
  footer { color: var(--muted); font-size: clamp(11px, 0.9vw, 15px); display: flex; justify-content: space-between; }
  .err { color: #ff8a80; }

  /* ---- spare tile ---- */
  .tile { display: flex; flex-direction: column; min-width: 0; }
  .tile.brewery { align-items: center; justify-content: center; text-align: center; gap: 0.3em;
    background: linear-gradient(160deg, #2a2213, var(--panel)); border-color: #4a3a18; }
  .tile.brewery .bname { font-size: calc(clamp(24px, 3.2vw, 56px) * var(--fs)); font-weight: 800; line-height: 1.05; color: var(--accent); }
  .tile.brewery .bsub { color: var(--muted); font-size: calc(clamp(13px, 1.3vw, 22px) * var(--fs)); letter-spacing: 0.12em; text-transform: uppercase; }
  .tile.info { gap: calc(clamp(6px, 0.8vh, 12px) * var(--fs)); }
  .tile .kicker { color: var(--accent); font-size: calc(clamp(11px, 1vw, 16px) * var(--fs)); text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; display: flex; justify-content: space-between; }
  .tile .kicker span:last-child { color: var(--muted); font-weight: 400; letter-spacing: 0.04em; text-transform: none; }
  .tile .body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: calc(clamp(4px, 0.6vh, 10px) * var(--fs)); }
  .tile.fade .body { animation: fadein .5s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .game { display: grid; grid-template-columns: 1fr auto auto; align-items: center; column-gap: 0.8em;
    font-size: calc(clamp(14px, 1.7vw, 30px) * var(--fs)); line-height: 1.3; }
  .game .teams { display: flex; align-items: center; gap: 0.45em; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .game img { height: 1.15em; width: 1.15em; object-fit: contain; }
  .game .score { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .game .status { color: var(--muted); font-size: 0.8em; white-space: nowrap; min-width: 4.5em; text-align: right; }
  .game.live .status { color: #ff6b6b; font-weight: 600; }
  .game .win { color: var(--text); } .game .lose { color: var(--muted); }
  .q { font-size: calc(clamp(15px, 1.55vw, 26px) * var(--fs)); font-weight: 600; line-height: 1.25; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 0.35em 1em; color: var(--muted); font-size: calc(clamp(12px, 1.2vw, 20px) * var(--fs)); }
  .choices .right { color: #7ee2a0; font-weight: 700; }
  .fact { font-size: calc(clamp(15px, 1.6vw, 27px) * var(--fs)); line-height: 1.3; }

  /* Phone: single column, scrollable. */
  @media (max-width: 700px) {
    body { overflow: auto; height: auto; min-height: 100%; --safe: 0px; }
    main { grid-template-columns: 1fr !important; grid-auto-rows: auto; }
    .tap, .tile { --fs: 1; }
    .tile.info { min-height: 160px; }
    .name { white-space: normal; }
  }
</style>
</head>
<body>
  <header>
    <h1 id="title">On Tap</h1>
    <div class="clock" id="clock"></div>
  </header>
  <main id="taps"><div class="empty">Loading…</div></main>
  <footer>
    <span id="status"></span>
    <span>brewtoscreen</span>
  </footer>

<script>
  // SRM -> approximate beer colour (Standard Reference Method chart).
  function srmToHex(srm) {
    if (srm == null) return '#c9a227';
    const table = [
      [1,'#FFE699'],[2,'#FFD878'],[3,'#FFCA5A'],[4,'#FFBF42'],[5,'#FBB123'],[6,'#F8A600'],[7,'#F39C00'],
      [8,'#EA8F00'],[9,'#E58500'],[10,'#DE7C00'],[11,'#D77200'],[12,'#CF6900'],[13,'#CB6200'],[14,'#C35900'],
      [15,'#BB5100'],[16,'#B54C00'],[17,'#B04500'],[18,'#A63E00'],[19,'#A13700'],[20,'#9B3200'],[21,'#952D00'],
      [22,'#8E2900'],[23,'#882300'],[24,'#821E00'],[25,'#7B1A00'],[26,'#771900'],[27,'#701400'],[28,'#6A0E00'],
      [29,'#660D00'],[30,'#5E0B00'],[35,'#4C0505'],[40,'#300000'],
    ];
    let hex = table[table.length - 1][1];
    for (const [s, h] of table) { if (srm <= s) { hex = h; break; } }
    return hex;
  }

  // Pint glass: solid beer colour with a glass outline, a thin highlight,
  // a thicker base and a foam head with a slightly uneven underside.
  function glassSvg(srm) {
    const beer = srmToHex(srm);
    return `
      <svg class="glass" viewBox="0 0 64 100" aria-hidden="true">
        <!-- beer -->
        <path d="M11 20 L53 20 L49 90 Q48 95 43 95 L21 95 Q16 95 15 90 Z" fill="${beer}"/>
        <!-- thick glass base -->
        <path d="M15.6 82 L48.4 82 L48 90 Q47.5 95 43 95 L21 95 Q16.5 95 16 90 Z" fill="rgba(0,0,0,.28)"/>
        <!-- highlight down the left side -->
        <path d="M19 28 L17.5 80" stroke="rgba(255,255,255,.38)" stroke-width="3.5" stroke-linecap="round"/>
        <!-- glass outline -->
        <path d="M10 12 L54 12 L49.5 90 Q49 96 43 96 L21 96 Q15 96 14.5 90 Z" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-linejoin="round"/>
        <!-- foam -->
        <path d="M8 10 Q8 2 16 3 Q22 -1 32 2 Q42 -1 48 3 Q56 2 56 10 L56 17 Q52 22 46 19 Q40 24 32 20 Q24 24 18 19 Q12 22 8 17 Z" fill="#fff6e0"/>
      </svg>`;
  }

  function fmtDate(ms) {
    if (!ms) return null;
    return new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function esc(s) { return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // Columns and a text scale, tuned for a 16:9 TV.
  function layout(n) {
    if (n <= 1) return { cols: 1, scale: 1.2 };
    if (n <= 2) return { cols: 2, scale: 1.1 };
    if (n <= 4) return { cols: 2, scale: 1 };
    if (n <= 6) return { cols: 2, scale: 0.92 };
    return { cols: 2, scale: 0.8 };   // 7-8 cards: two columns of four
  }

  function tapCard({ tap, label, beer: b }) {
    const stats = [
      b.abv != null && `<div class="stat"><b>${b.abv.toFixed(1)}%</b><span>ABV</span></div>`,
      b.ibu != null && `<div class="stat"><b>${Math.round(b.ibu)}</b><span>IBU</span></div>`,
      b.og != null && `<div class="stat"><b>${b.og.toFixed(3)}</b><span>OG</span></div>`,
      b.fg != null && `<div class="stat"><b>${b.fg.toFixed(3)}</b><span>FG</span></div>`,
      b.srm != null && `<div class="stat"><b>${Math.round(b.srm)}</b><span>SRM</span></div>`,
    ].filter(Boolean).join('');
    const meta = [
      b.batchNo != null && `Batch #${b.batchNo}`,
      b.bottlingDate && `Kegged ${fmtDate(b.bottlingDate)}`,
      !b.bottlingDate && b.brewDate && `Brewed ${fmtDate(b.brewDate)}`,
      label && esc(label),
    ].filter(Boolean).join(' · ');
    return `
      <article class="tap">
        <div class="num">${tap}</div>
        ${glassSvg(b.srm)}
        <div class="name" title="${esc(b.name)}">${esc(b.name)}</div>
        <div class="style">${esc(b.style || b.type || '')}</div>
        <div class="bottom">
          <div class="stats">${stats}</div>
          <div class="meta">${meta}</div>
        </div>
      </article>`;
  }

  let extra = { mode: 'none' };

  function render(data) {
    document.getElementById('title').textContent = data.title || 'On Tap';
    document.title = data.title || 'On Tap';
    extra = data.extra || { mode: 'none' };
    const main = document.getElementById('taps');
    const taps = data.taps || [];
    if (!taps.length) {
      main.style.setProperty('--cols', 1);
      main.innerHTML = '<div class="empty">Nothing on tap right now.<br>Pick some batches on the admin page.</div>';
      stopRotation();
      return;
    }
    const spare = taps.length % 2 === 1 && extra.mode !== 'none';
    const { cols, scale } = layout(taps.length + (spare ? 1 : 0));
    main.style.setProperty('--cols', cols);
    main.style.setProperty('--scale', scale);

    const cards = taps.map(tapCard);
    if (spare && extra.mode === 'brewery') {
      cards.unshift(`<div class="tile brewery"><div class="bname">${esc(extra.breweryName || data.title)}</div><div class="bsub">Est. in the garage</div></div>`);
    } else if (spare && extra.mode === 'info') {
      cards.push(`<div class="tile info" id="infoTile"><div class="kicker"><span>Loading…</span><span></span></div><div class="body"></div></div>`);
    }
    main.innerHTML = cards.join('');
    if (spare && extra.mode === 'info') startRotation(); else stopRotation();
  }

  // ---- rotating info tile ----
  let slides = [], slideIdx = 0, rotTimer = null, contentTimer = null;

  function gameRow(g) {
    const live = g.state === 'in';
    const done = g.state === 'post';
    const cls = (t) => (done ? (t.winner ? 'win' : 'lose') : '');
    const team = (t) => `<span class="${cls(t)}">${t.logo ? `<img src="${esc(t.logo)}" alt="">` : ''}${esc(t.abbr || t.name)}</span>`;
    const score = g.state === 'pre' ? '' : `<span class="${cls(g.away)}">${esc(g.away.score)}</span>&nbsp;-&nbsp;<span class="${cls(g.home)}">${esc(g.home.score)}</span>`;
    return `<div class="game ${live ? 'live' : ''}">
      <div class="teams">${team(g.away)} <span style="color:var(--muted)">@</span> ${team(g.home)}</div>
      <div class="score">${score}</div>
      <div class="status">${esc(g.detail)}</div>
    </div>`;
  }

  function buildSlides(c) {
    const out = [];
    for (const lg of c.scores || []) {
      if (!lg.games.length) continue;
      const anyLive = lg.games.some((g) => g.state === 'in');
      out.push({ kicker: lg.label, note: anyLive ? 'Live' : '', html: lg.games.slice(0, 4).map(gameRow).join('') });
    }
    for (const q of c.trivia || []) {
      const choices = (mark) => `<div class="choices">${q.choices.map((ch) => `<span class="${mark && ch === q.answer ? 'right' : ''}">${mark && ch === q.answer ? '✓ ' : ''}${esc(ch)}</span>`).join('')}</div>`;
      out.push({ kicker: 'Trivia', note: q.category, html: `<div class="q">${esc(q.question)}</div>${choices(false)}` });
      out.push({ kicker: 'Trivia', note: 'Answer', html: `<div class="q">${esc(q.question)}</div>${choices(true)}` });
    }
    return out;
  }

  function showSlide() {
    const tile = document.getElementById('infoTile');
    if (!tile || !slides.length) return;
    const s = slides[slideIdx % slides.length];
    tile.classList.remove('fade'); void tile.offsetWidth; tile.classList.add('fade');
    tile.innerHTML = `<div class="kicker"><span>${esc(s.kicker)}</span><span>${esc(s.note)}</span></div><div class="body">${s.html}</div>`;
    slideIdx++;
  }

  async function loadContent() {
    try {
      const res = await fetch('/api/extra/content', { cache: 'no-store' });
      const c = await res.json();
      const fresh = buildSlides(c);
      if (fresh.length) slides = fresh;
      if (slides.length && !rotTimer) {
        showSlide();
        rotTimer = setInterval(showSlide, (c.seconds || 12) * 1000);
      }
      // Trivia loads in the background on the server; check back soon if it is not here yet.
      if (!(c.trivia || []).length) setTimeout(loadContent, 20_000);
    } catch (err) {
      const tile = document.getElementById('infoTile');
      if (tile && !slides.length) tile.innerHTML = `<div class="kicker"><span>Info</span></div><div class="body fact">Nothing to show yet.</div>`;
    }
  }

  function startRotation() {
    if (!contentTimer) {
      loadContent();
      contentTimer = setInterval(loadContent, 120_000);
    } else if (slides.length) {
      showSlide();
    }
  }
  function stopRotation() {
    clearInterval(rotTimer); clearInterval(contentTimer);
    rotTimer = contentTimer = null; slides = [];
  }

  async function refresh() {
    const status = document.getElementById('status');
    try {
      const res = await fetch('/api/taps', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      render(await res.json());
      status.className = '';
      status.textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    } catch (err) {
      status.className = 'err';
      status.textContent = 'Could not reach the tap server: ' + err.message;
    }
  }

  function tickClock() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  refresh();
  tickClock();
  setInterval(refresh, 60_000);
  setInterval(tickClock, 10_000);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On Tap</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181c24;
    --panel-2: #1f2430;
    --text: #f3f1ea;
    --muted: #9aa3b2;
    --accent: #f2b53a;
    --line: #2b3240;
    --radius: 18px;
    /* TVs often crop the outer few percent of the picture (overscan). */
    --safe: 3vmin;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #1c2130 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: calc(var(--safe) + clamp(8px, 1vw, 16px));
    gap: clamp(10px, 1.6vh, 24px);
    overflow: hidden;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  h1 { margin: 0; font-size: clamp(26px, 4vw, 60px); letter-spacing: 0.02em; font-weight: 700; }
  .clock { color: var(--muted); font-size: clamp(16px, 2vw, 30px); font-variant-numeric: tabular-nums; }

  main {
    flex: 1; min-height: 0;
    display: grid;
    gap: clamp(10px, 1.4vw, 22px);
    grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
    /* minmax(0, …) so rows never grow past the screen; cards clip instead. */
    grid-auto-rows: minmax(0, 1fr);
  }
  .tap, .tile {
    --fs: var(--scale, 1);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: calc(clamp(12px, 1.4vw, 24px) * var(--fs));
    min-height: 0; overflow: hidden;
  }
  .tap {
    display: grid;
    grid-template-columns: auto auto minmax(0, 1fr) auto;
    grid-template-rows: minmax(0, 1fr);
    column-gap: clamp(10px, 1.2vw, 20px);
    align-items: start;
  }
  .info { display: flex; flex-direction: column; min-width: 0; height: 100%; }
  .info .bottom { margin-top: auto; }
  /* four stat bubbles in a 2x2 block on the right */
  .bubbles {
    align-self: center;
    display: grid; grid-template-columns: auto auto;
    column-gap: calc(clamp(18px, 2.2vw, 44px) * var(--fs));
    row-gap: calc(clamp(6px, 0.9vw, 18px) * var(--fs));
    padding-left: calc(clamp(14px, 1.6vw, 32px) * var(--fs));
    border-left: 1px solid var(--line);
  }
  .bubble { display: flex; flex-direction: column; min-width: calc(clamp(44px, 4.6vw, 90px) * var(--fs)); }
  .bubble b { font-size: calc(clamp(20px, 2.5vw, 46px) * var(--fs)); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .bubble span { font-size: calc(clamp(9px, 0.85vw, 14px) * var(--fs)); color: var(--muted); text-transform: uppercase; letter-spacing: 0.14em; margin-top: 0.35em; }
  .num {
    width: calc(clamp(40px, 4vw, 76px) * var(--fs)); height: calc(clamp(40px, 4vw, 76px) * var(--fs));
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent); color: #1a1405;
    font-weight: 800; font-size: calc(clamp(18px, 2.1vw, 38px) * var(--fs));
  }
  .glass {
    height: calc(clamp(56px, 7.2vw, 128px) * var(--fs));
    width: auto;
  }
  .name {
    font-size: calc(clamp(22px, 3.3vw, 60px) * var(--fs));
    font-weight: 700; line-height: 1.1;
    overflow: hidden; max-height: 2.2em;  /* at most two lines */
  }
  .style { color: var(--muted); font-size: calc(clamp(15px, 1.95vw, 34px) * var(--fs)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.1em; }
  .bottom { display: flex; flex-direction: column; gap: clamp(4px, 0.6vh, 10px); min-width: 0; padding-top: 0.4em; }
  .meta { color: var(--muted); font-size: calc(clamp(12px, 1.1vw, 18px) * var(--fs)); display: flex; gap: 1.2em; flex-wrap: wrap; }
  /* coming soon: on a tap but not kegged yet */
  .tap.soon { border-style: dashed; border-color: rgba(242,181,58,.45); }
  .tap.soon .glass { opacity: .45; }
  .tap.soon .num { background: transparent; border: 2px dashed var(--accent); color: var(--accent); }
  .tap.soon .bubbles { opacity: .6; }
  .soonpill { display: inline-block; padding: 0.15em 0.7em; border-radius: 999px; background: var(--accent); color: #1a1405; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.85em; }
  .tap.kicked { background: var(--panel); border-style: dashed; border-color: #343b4a; }
  .tap.kicked .num { background: #3a3f4b; color: #8b93a3; }
  .tap.kicked .name { color: #6f7785; letter-spacing: 0.04em; }
  .tap.kicked .style, .tap.kicked .meta { color: #5c6473; }
  .empty {
    grid-column: 1 / -1; display: grid; place-items: center; text-align: center;
    color: var(--muted); font-size: clamp(18px, 2vw, 32px);
  }
  footer { color: var(--muted); font-size: clamp(11px, 0.9vw, 15px); display: flex; justify-content: space-between; }
  .err { color: #ff8a80; }

  /* ---- spare tile ---- */
  .tile { display: flex; flex-direction: column; min-width: 0; }
  .tile.brewery { align-items: center; justify-content: center; text-align: center; gap: 0.3em;
    background: linear-gradient(160deg, #2a2213, var(--panel)); border-color: #4a3a18; }
  .tile.brewery .bname { font-size: calc(clamp(24px, 3.2vw, 56px) * var(--fs)); font-weight: 800; line-height: 1.05; color: var(--accent); }
  .tile.brewery .bsub { color: var(--muted); font-size: calc(clamp(13px, 1.3vw, 22px) * var(--fs)); letter-spacing: 0.12em; text-transform: uppercase; }
  .tile.info { gap: calc(clamp(6px, 0.8vh, 12px) * var(--fs)); }
  .tile .kicker { color: var(--accent); font-size: calc(clamp(11px, 1vw, 16px) * var(--fs)); text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; display: flex; justify-content: space-between; }
  .tile .kicker span:last-child { color: var(--muted); font-weight: 400; letter-spacing: 0.04em; text-transform: none; }
  .tile .body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: calc(clamp(4px, 0.6vh, 10px) * var(--fs)); }
  .tile.fade .body { animation: fadein .5s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .game { display: grid; grid-template-columns: 1fr auto auto; align-items: center; column-gap: 0.8em;
    font-size: calc(clamp(14px, 1.6vw, 28px) * var(--fs)); line-height: 1.3; }
  /* live score cut-in */
  .kicker .livedot::before { content: ''; display: inline-block; width: 0.55em; height: 0.55em; border-radius: 50%; background: #ff5252; margin-right: 0.4em; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .live-big { display: flex; align-items: center; justify-content: center; gap: calc(clamp(12px, 1.6vw, 30px) * var(--fs)); }
  .live-big .lt { display: flex; align-items: center; gap: 0.35em; font-size: calc(clamp(18px, 2.3vw, 42px) * var(--fs)); font-weight: 700; }
  .live-big .lt img { height: 1.3em; width: 1.3em; object-fit: contain; }
  .live-big .sc { font-size: 1.35em; font-variant-numeric: tabular-nums; margin-left: 0.2em; }
  .live-big .lt.scored .sc { color: var(--accent); }
  .live-big .vs { color: var(--muted); font-size: calc(clamp(14px, 1.6vw, 28px) * var(--fs)); }
  .live-status { text-align: center; color: var(--muted); font-size: calc(clamp(13px, 1.3vw, 22px) * var(--fs)); margin-top: 0.4em; }
  .game .teams { display: flex; align-items: center; gap: 0.45em; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .game img { height: 1.15em; width: 1.15em; object-fit: contain; }
  .game .score { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .game .status { color: var(--muted); font-size: 0.8em; white-space: nowrap; min-width: 4.5em; text-align: right; }
  .game.live .status { color: #ff6b6b; font-weight: 600; }
  .game .win { color: var(--text); } .game .lose { color: var(--muted); }
  .q { font-size: calc(clamp(15px, 1.55vw, 26px) * var(--fs)); font-weight: 600; line-height: 1.25; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 0.35em 1em; color: var(--muted); font-size: calc(clamp(12px, 1.2vw, 20px) * var(--fs)); }
  .choices .right { color: #7ee2a0; font-weight: 700; }
  .fact { font-size: calc(clamp(15px, 1.6vw, 27px) * var(--fs)); line-height: 1.3; }

  /* Phone: single column, scrollable. */
  @media (max-width: 700px) {
    body { overflow: auto; height: auto; min-height: 100%; --safe: 0px; }
    main { grid-template-columns: 1fr !important; grid-auto-rows: auto; }
    .tap, .tile { --fs: 1; }
    .tile.info { min-height: 160px; }
    .name { white-space: normal; }
  }
</style>
</head>
<body>
  <header>
    <h1 id="title">On Tap</h1>
    <div class="clock" id="clock"></div>
  </header>
  <main id="taps"><div class="empty">Loading…</div></main>
  <footer>
    <span id="status"></span>
    <span>brewtoscreen</span>
  </footer>

<script>
  // SRM -> approximate beer colour (Standard Reference Method chart).
  function srmToHex(srm) {
    if (srm == null) return '#c9a227';
    const table = [
      [1,'#FFE699'],[2,'#FFD878'],[3,'#FFCA5A'],[4,'#FFBF42'],[5,'#FBB123'],[6,'#F8A600'],[7,'#F39C00'],
      [8,'#EA8F00'],[9,'#E58500'],[10,'#DE7C00'],[11,'#D77200'],[12,'#CF6900'],[13,'#CB6200'],[14,'#C35900'],
      [15,'#BB5100'],[16,'#B54C00'],[17,'#B04500'],[18,'#A63E00'],[19,'#A13700'],[20,'#9B3200'],[21,'#952D00'],
      [22,'#8E2900'],[23,'#882300'],[24,'#821E00'],[25,'#7B1A00'],[26,'#771900'],[27,'#701400'],[28,'#6A0E00'],
      [29,'#660D00'],[30,'#5E0B00'],[35,'#4C0505'],[40,'#300000'],
    ];
    let hex = table[table.length - 1][1];
    for (const [s, h] of table) { if (srm <= s) { hex = h; break; } }
    return hex;
  }

  // Pint glass: solid beer colour with a glass outline, a thin highlight,
  // a thicker base and a foam head with a slightly uneven underside.
  function glassSvg(srm) {
    const beer = srmToHex(srm);
    return `
      <svg class="glass" viewBox="0 0 64 100" aria-hidden="true">
        <!-- beer -->
        <path d="M11 20 L53 20 L49 90 Q48 95 43 95 L21 95 Q16 95 15 90 Z" fill="${beer}"/>
        <!-- thick glass base -->
        <path d="M15.6 82 L48.4 82 L48 90 Q47.5 95 43 95 L21 95 Q16.5 95 16 90 Z" fill="rgba(0,0,0,.28)"/>
        <!-- highlight down the left side -->
        <path d="M19 28 L17.5 80" stroke="rgba(255,255,255,.38)" stroke-width="3.5" stroke-linecap="round"/>
        <!-- glass outline -->
        <path d="M10 12 L54 12 L49.5 90 Q49 96 43 96 L21 96 Q15 96 14.5 90 Z" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-linejoin="round"/>
        <!-- foam -->
        <path d="M8 10 Q8 2 16 3 Q22 -1 32 2 Q42 -1 48 3 Q56 2 56 10 L56 17 Q52 22 46 19 Q40 24 32 20 Q24 24 18 19 Q12 22 8 17 Z" fill="#fff6e0"/>
      </svg>`;
  }

  function fmtDate(ms) {
    if (!ms) return null;
    return new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function esc(s) { return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // Columns and a text scale, tuned for a 16:9 TV.
  function layout(n) {
    if (n <= 1) return { cols: 1, scale: 1.2 };
    if (n <= 2) return { cols: 2, scale: 1.1 };
    if (n <= 4) return { cols: 2, scale: 1 };
    if (n <= 6) return { cols: 2, scale: 0.92 };
    return { cols: 2, scale: 0.8 };   // 7-8 cards: two columns of four
  }

  // Empty glass for a kicked tap: outline only, foam residue, and a sad face.
  function emptyGlassSvg() {
    return `
      <svg class="glass" viewBox="0 0 64 100" aria-hidden="true">
        <path d="M10 12 L54 12 L49.5 90 Q49 96 43 96 L21 96 Q15 96 14.5 90 Z" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.28)" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M15.6 82 L48.4 82 L48 90 Q47.5 95 43 95 L21 95 Q16.5 95 16 90 Z" fill="rgba(255,255,255,.08)"/>
        <path d="M14 18 Q20 24 26 18 M36 16 Q42 22 48 17" fill="none" stroke="rgba(255,246,224,.35)" stroke-width="3" stroke-linecap="round"/>
        <!-- sad face -->
        <circle cx="24" cy="44" r="3.2" fill="rgba(255,255,255,.55)"/>
        <circle cx="40" cy="44" r="3.2" fill="rgba(255,255,255,.55)"/>
        <path d="M22 66 Q32 56 42 66" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M44 50 Q46 56 44 60" fill="none" stroke="rgba(150,200,255,.6)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>`;
  }

  // Non-beer items get their own glassware.
  function customGlassSvg(b) {
    if (b.kind === 'seltzer') {
      // Tall clear glass, faint fizz, lime wedge.
      return `
        <svg class="glass" viewBox="0 0 64 100" aria-hidden="true">
          <path d="M13 18 L51 18 L48 90 Q47.5 95 43 95 L21 95 Q16.5 95 16 90 Z" fill="rgba(200,235,245,.28)"/>
          <path d="M10 12 L54 12 L49.5 90 Q49 96 43 96 L21 96 Q15 96 14.5 90 Z" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M19 28 L17.5 80" stroke="rgba(255,255,255,.35)" stroke-width="3.5" stroke-linecap="round"/>
          <g fill="rgba(255,255,255,.55)"><circle cx="26" cy="70" r="2"/><circle cx="36" cy="58" r="1.6"/><circle cx="30" cy="42" r="1.4"/><circle cx="41" cy="78" r="1.8"/><circle cx="24" cy="54" r="1.2"/><circle cx="38" cy="32" r="1.3"/></g>
          <path d="M50 10 A12 12 0 0 1 62 22 L50 22 Z" fill="#9bd36a" stroke="#d9f2b0" stroke-width="2"/>
        </svg>`;
    }
    if (b.kind === 'tea') {
      // Amber tea, no head, a couple of hop-leaf flecks.
      return `
        <svg class="glass" viewBox="0 0 64 100" aria-hidden="true">
          <path d="M12 20 L52 20 L48.5 90 Q48 95 43 95 L21 95 Q16 95 15.5 90 Z" fill="${srmToHex(b.srm ?? 9)}" opacity=".92"/>
          <path d="M10 12 L54 12 L49.5 90 Q49 96 43 96 L21 96 Q15 96 14.5 90 Z" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M19 28 L17.5 80" stroke="rgba(255,255,255,.3)" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M28 48 q6 -6 12 0 q-6 6 -12 0 Z M34 66 q6 -6 12 0 q-6 6 -12 0 Z" fill="#8fbf5a" opacity=".85"/>
        </svg>`;
    }
    return glassSvg(b.srm ?? 5);
  }

  function tapCard({ tap, label, beer: b }) {
    if (!b) {
      return `
        <article class="tap kicked">
          <div class="num">${tap}</div>
          ${emptyGlassSvg()}
          <div class="info">
            <div class="name">Kicked</div>
            <div class="style">${esc(label || 'Next batch coming soon')}</div>
            <div class="bottom"><div class="meta">Empty keg</div></div>
          </div>
        </article>`;
    }
    const bubble = (v, label) => `<div class="bubble"><b>${v}</b><span>${label}</span></div>`;
    const stats = [
      bubble(b.abv != null ? b.abv.toFixed(1) + '%' : '–', 'ABV'),
      bubble(b.ibu != null ? Math.round(b.ibu) : '–', 'IBU'),
      bubble(b.calories != null ? Math.round(b.calories) : '–', 'Cal'),
      bubble(b.carbs != null ? (b.carbs < 10 ? b.carbs.toFixed(1) : Math.round(b.carbs)) + 'g' : '–', 'Carbs'),
    ].join('');
    const soon = Boolean(b.comingSoon);
    const meta = [
      soon && `<span class="soonpill">Coming soon</span>`,
      soon && b.brewDate && `Brewed ${fmtDate(b.brewDate)} · in the fermenter`,
      !soon && b.batchNo != null && `Batch #${b.batchNo}`,
      !soon && b.bottlingDate && `Kegged ${fmtDate(b.bottlingDate)}`,
      !soon && !b.bottlingDate && b.brewDate && `Brewed ${fmtDate(b.brewDate)}`,
      b.custom && b.notes && esc(b.notes),
      label && esc(label),
    ].filter(Boolean).join(' · ');
    return `
      <article class="tap ${soon ? 'soon' : ''}">
        <div class="num">${tap}</div>
        ${b.custom ? customGlassSvg(b) : glassSvg(b.srm)}
        <div class="info">
          <div class="name" title="${esc(b.name)}">${esc(b.name)}</div>
          <div class="style">${esc(b.style || b.type || '')}</div>
          <div class="bottom"><div class="meta">${meta}</div></div>
        </div>
        <div class="bubbles">${stats}</div>
      </article>`;
  }

  let extra = { mode: 'none' };

  function render(data) {
    document.getElementById('title').textContent = data.title || 'On Tap';
    document.title = data.title || 'On Tap';
    extra = data.extra || { mode: 'none' };
    const main = document.getElementById('taps');
    const taps = data.taps || [];
    if (!taps.length) {
      main.style.setProperty('--cols', 1);
      main.innerHTML = '<div class="empty">Nothing on tap right now.<br>Pick some batches on the admin page.</div>';
      stopRotation();
      return;
    }
    const spare = taps.length % 2 === 1 && extra.mode !== 'none';
    const { cols, scale } = layout(taps.length + (spare ? 1 : 0));
    main.style.setProperty('--cols', cols);
    main.style.setProperty('--scale', scale);

    const cards = taps.map(tapCard);
    if (spare && extra.mode === 'brewery') {
      cards.unshift(`<div class="tile brewery"><div class="bname">${esc(extra.breweryName || data.title)}</div><div class="bsub">Est. in the garage</div></div>`);
    } else if (spare && extra.mode === 'info') {
      cards.push(`<div class="tile info" id="infoTile"><div class="kicker"><span>Loading…</span><span></span></div><div class="body"></div></div>`);
    }
    main.innerHTML = cards.join('');
    if (spare && extra.mode === 'info') startRotation(); else stopRotation();
  }

  // ---- rotating info tile ----
  let slides = [], slideIdx = 0, rotTimer = null, contentTimer = null;

  function gameRow(g) {
    const live = g.state === 'in';
    const done = g.state === 'post';
    const cls = (t) => (done ? (t.winner ? 'win' : 'lose') : '');
    const team = (t) => `<span class="${cls(t)}">${t.logo ? `<img src="${esc(t.logo)}" alt="">` : ''}${esc(t.abbr || t.name)}</span>`;
    const score = g.state === 'pre' ? '' : `<span class="${cls(g.away)}">${esc(g.away.score)}</span>&nbsp;-&nbsp;<span class="${cls(g.home)}">${esc(g.home.score)}</span>`;
    return `<div class="game ${live ? 'live' : ''}">
      <div class="teams">${team(g.away)} <span style="color:var(--muted)">@</span> ${team(g.home)}</div>
      <div class="score">${score}</div>
      <div class="status">${esc(g.detail)}</div>
    </div>`;
  }

  // Order: a scores slide, then N trivia questions (question + answer each),
  // then the next league's scores, and so on round-robin.
  function buildSlides(c) {
    const scores = [];
    for (const lg of c.scores || []) {
      if (!lg.games.length) continue;
      // Three games per slide keeps the rows inside the tile on a 1080p TV.
      const chunks = [];
      for (let i = 0; i < Math.min(lg.games.length, 9); i += 3) chunks.push(lg.games.slice(i, i + 3));
      chunks.forEach((games, i) => {
        const anyLive = games.some((g) => g.state === 'in');
        const note = [anyLive ? 'Live' : '', chunks.length > 1 ? `${i + 1}/${chunks.length}` : ''].filter(Boolean).join(' · ');
        scores.push({ kicker: lg.label, note, html: games.map(gameRow).join('') });
      });
    }
    const trivia = [];
    for (const q of c.trivia || []) {
      const choices = (mark) => `<div class="choices">${q.choices.map((ch) => `<span class="${mark && ch === q.answer ? 'right' : ''}">${mark && ch === q.answer ? '✓ ' : ''}${esc(ch)}</span>`).join('')}</div>`;
      trivia.push([
        { kicker: 'Trivia', note: q.category, html: `<div class="q">${esc(q.question)}</div>${choices(false)}` },
        { kicker: 'Trivia', note: 'Answer', html: `<div class="q">${esc(q.question)}</div>${choices(true)}` },
      ]);
    }
    if (!trivia.length) return scores;
    const every = Number(c.scoresEvery) || 0;   // 0 = all score slides once per trivia loop
    if (!every) return [...scores, ...trivia.flat()];
    const out = [];
    let s = 0;
    for (let i = 0; i < trivia.length; i++) {
      if (scores.length && i % every === 0) out.push(scores[s++ % scores.length]);
      out.push(...trivia[i]);
    }
    return out;
  }

  function showSlide() {
    const tile = document.getElementById('infoTile');
    if (!tile || !slides.length) return;
    const s = slides[slideIdx % slides.length];
    tile.classList.remove('fade'); void tile.offsetWidth; tile.classList.add('fade');
    tile.innerHTML = `<div class="kicker"><span>${esc(s.kicker)}</span><span>${esc(s.note)}</span></div><div class="body">${s.html}</div>`;
    slideIdx++;
  }

  // ---- live score cut-ins ----
  // Remember each live game's score; when one changes, show that game right
  // away (at most once per `liveMinutes`), then carry on with the rotation.
  const lastScore = new Map();   // game id -> "away-home"
  let lastCutIn = 0;
  let slideSeconds = 12;

  function liveSlide(g, label) {
    const team = (t, scored) => `<div class="lt ${scored ? 'scored' : ''}">${t.logo ? `<img src="${esc(t.logo)}" alt="">` : ''}<span class="ab">${esc(t.abbr || t.name)}</span><span class="sc">${esc(t.score)}</span></div>`;
    return `<div class="live-big">${team(g.away, g.awayScored)}<div class="vs">@</div>${team(g.home, g.homeScored)}</div><div class="live-status">${esc(g.detail)}</div>`;
  }

  function detectLiveChanges(c, liveMinutes) {
    const changed = [];
    for (const lg of c.scores || []) {
      for (const g of lg.games) {
        const key = `${g.away.score}-${g.home.score}`;
        const prev = lastScore.get(g.id);
        if (g.state === 'in' && prev !== undefined && prev !== key) {
          const [pa, ph] = prev.split('-');
          changed.push({ ...g, label: lg.label, awayScored: pa !== g.away.score, homeScored: ph !== g.home.score });
        }
        lastScore.set(g.id, key);
      }
    }
    if (!changed.length || !liveMinutes) return;
    if (Date.now() - lastCutIn < liveMinutes * 60_000) return;
    lastCutIn = Date.now();
    const g = changed[0];
    const tile = document.getElementById('infoTile');
    if (!tile) return;
    tile.classList.remove('fade'); void tile.offsetWidth; tile.classList.add('fade');
    tile.innerHTML = `<div class="kicker"><span>Score update</span><span class="livedot">${esc(g.label)} · Live</span></div><div class="body">${liveSlide(g)}</div>`;
    // Hold this slide for a full interval, then resume where the rotation was.
    clearInterval(rotTimer);
    rotTimer = setInterval(showSlide, slideSeconds * 1000);
  }

  async function loadContent() {
    let anyLive = false;
    try {
      const res = await fetch('/api/extra/content', { cache: 'no-store' });
      const c = await res.json();
      slideSeconds = c.seconds || 12;
      anyLive = (c.scores || []).some((lg) => lg.games.some((g) => g.state === 'in'));
      const fresh = buildSlides(c);
      if (fresh.length) slides = fresh;
      if (slides.length && !rotTimer) {
        showSlide();
        rotTimer = setInterval(showSlide, slideSeconds * 1000);
      }
      detectLiveChanges(c, c.liveMinutes ?? 2);
      // Trivia loads in the background on the server; check back soon if it is not here yet.
      if (!(c.trivia || []).length) anyLive = true;
    } catch (err) {
      const tile = document.getElementById('infoTile');
      if (tile && !slides.length) tile.innerHTML = `<div class="kicker"><span>Info</span></div><div class="body fact">Nothing to show yet.</div>`;
    }
    // Poll faster while a game is live so score changes show up quickly.
    clearTimeout(contentTimer);
    contentTimer = setTimeout(loadContent, anyLive ? 30_000 : 120_000);
  }

  function startRotation() {
    if (!contentTimer) {
      loadContent();
    } else if (slides.length) {
      showSlide();
    }
  }
  function stopRotation() {
    clearInterval(rotTimer); clearTimeout(contentTimer);
    rotTimer = contentTimer = null; slides = [];
  }

  async function refresh() {
    const status = document.getElementById('status');
    try {
      const res = await fetch('/api/taps', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      render(await res.json());
      status.className = '';
      status.textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    } catch (err) {
      status.className = 'err';
      status.textContent = 'Could not reach the tap server: ' + err.message;
    }
  }

  function tickClock() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  refresh();
  tickClock();
  setInterval(refresh, 60_000);
  setInterval(tickClock, 10_000);
</script>
</body>
</html>
